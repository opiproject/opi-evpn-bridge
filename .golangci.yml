version: "2"
linters:
  enable:
    - bodyclose
    - dogsled
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 200
    funlen:
      lines: 120
      statements: 120
    gocognit:
      min-complexity: 32
    gosec:
      excludes:
        - G115 # integer overflow conversion: values are bounded by domain constraints
    staticcheck:
      checks:
        - all
        - -QF* # disable opinionated quickfix suggestions (e.g. De Morgan's law rewrites)
    revive:
      rules:
        - name: var-naming
          # allow existing package names like "common" and "utils"
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
          - gocognit
          - gocritic
        path: (.+)_test.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
